import org.gradle.api.file.DirectoryProperty
import org.gradle.api.tasks.OutputDirectory

apply plugin: 'com.android.application'

android {
    namespace 'com.truemafia'
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        applicationId 'com.truemafia.v2'
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 7
        versionName '2.5'
        // React Native 0.60 and its modules ship native libraries for these ABIs.
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            // Test APK; production distribution needs a private release key.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging true
            pickFirsts += ['**/libc++_shared.so', '**/libjsc.so']
            excludes += ['**/libhermes*.so']
        }
    }
}

// Bundle into registered source directories rather than old AGP intermediate
// paths. This keeps standalone release APKs independent of Metro.
def jsAssets = layout.buildDirectory.dir('generated/mafia/assets')
def jsResources = layout.buildDirectory.dir('generated/mafia/res')
def bundleJs = tasks.register('bundleReleaseJsAndAssets', BundleTrueMafia) {
    workingDir rootProject.projectDir.parentFile
    inputs.files(fileTree(workingDir) {
        include '*.js', 'screens/**', 'game/**', 'ui/**', 'resources/**', 'package.json', 'yarn.lock'
    })
    bundleAssets.set(jsAssets)
    bundleResources.set(jsResources)
    doFirst {
        // AGP assigns these directory properties when registering generated
        // sources. Resolve them at execution time, after that assignment.
        def assetsDirectory = bundleAssets.get().asFile
        def resourcesDirectory = bundleResources.get().asFile
        delete assetsDirectory, resourcesDirectory
        assetsDirectory.mkdirs()
        resourcesDirectory.mkdirs()
        commandLine 'node', 'node_modules/react-native/cli.js', 'bundle',
            '--platform', 'android', '--dev', 'false', '--entry-file', 'index.js',
            '--bundle-output', new File(assetsDirectory, 'index.android.bundle'),
            '--assets-dest', resourcesDirectory, '--max-workers', '2'
    }
}
// Register generated sources with AGP so resource mapping, lint, and packaging
// all depend on the bundling task without relying on task execution order.
androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(bundleJs) { it.bundleAssets }
        variant.sources.res.addGeneratedSourceDirectory(bundleJs) { it.bundleResources }
    }
}

abstract class BundleTrueMafia extends Exec {
    @OutputDirectory abstract DirectoryProperty getBundleAssets()
    @OutputDirectory abstract DirectoryProperty getBundleResources()
}

dependencies {
    implementation 'com.facebook.react:react-native:0.60.4'
    implementation 'org.webkit:android-jsc:r245459'
    implementation project(':react-native-gesture-handler')
    implementation project(':react-native-keep-awake')
    implementation project(':react-native-sound')
}
